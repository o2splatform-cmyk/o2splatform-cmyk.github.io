<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" role="img" aria-labelledby="t d">
  <title id="t">3-Stage Verification Pipeline</title>
  <desc id="d">Pre-hop redirect and host guard, SHA-256 digest and freshness gate, x402 integer settlement.</desc>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <style>text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}</style>
  <rect width="840" height="210" rx="16" fill="#0f172a"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#e2e8f0">3-Stage Verification Pipeline</text>
  <rect x="24" y="52" width="240" height="134" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".5"/>
  <rect x="300" y="52" width="240" height="134" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".5"/>
  <rect x="576" y="52" width="240" height="134" rx="12" fill="#1e293b" stroke="#34d399" stroke-opacity=".6"/>
  <path d="M266,119 H296" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M542,119 H572" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="48" cy="76" r="11" fill="#38bdf8"/><text x="48" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">1</text>
  <circle cx="324" cy="76" r="11" fill="#38bdf8"/><text x="324" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">2</text>
  <circle cx="600" cy="76" r="11" fill="#34d399"/><text x="600" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">3</text>
  <text x="66" y="81" font-size="13" font-weight="700" fill="#38bdf8">Pre-Hop Redirect &amp; Host Guard</text>
  <text x="342" y="81" font-size="13" font-weight="700" fill="#38bdf8">SHA-256 Digest &amp; Freshness</text>
  <text x="618" y="81" font-size="13" font-weight="700" fill="#34d399">x402 Integer Settlement</text>
  <g font-size="12" fill="#cbd5e1">
    <text x="42" y="112">Blocks 169.254.169.254</text>
    <text x="42" y="132">Rejects unapproved domains</text>
    <text x="42" y="152">before the hop is followed</text>
    <text x="318" y="112">Verifies release_id digest</text>
    <text x="318" y="132">verified_date &lt;= 90 days</text>
    <text x="318" y="152">Fail-closed on stale data</text>
    <text x="594" y="112">Base chainId 8453</text>
    <text x="594" y="132">1 USDC = 1_000_000n</text>
    <text x="594" y="152">micro-units (BigInt only)</text>
  </g>
</svg>
