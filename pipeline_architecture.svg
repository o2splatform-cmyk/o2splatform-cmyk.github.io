<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" role="img" aria-labelledby="t d">
  <title id="t">3-Stage Verification Pipeline</title>
  <desc id="d">Pre-hop redirect and host guard, SHA-256 digest and freshness gate, x402 integer settlement.</desc>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif}
    .h{font-size:13.5px;font-weight:700;text-anchor:middle}
    .b{font-size:13.5px;fill:#e2e8f0;text-anchor:middle}
    .c{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600}
    .k{fill:#7dd3fc}
    .g{fill:#6ee7b7}
  </style>
  <rect width="880" height="210" rx="16" fill="#0f172a"/>
  <text x="440" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#f8fafc">3-Stage Verification Pipeline</text>
  <rect x="24" y="52" width="256" height="134" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".5"/>
  <rect x="312" y="52" width="256" height="134" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".5"/>
  <rect x="600" y="52" width="256" height="134" rx="12" fill="#1e293b" stroke="#34d399" stroke-opacity=".6"/>
  <path d="M282,119 H308" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M570,119 H596" stroke="#38bdf8" stroke-width="2" marker-end="url(#ar)"/>

  <text x="152" y="78" class="h" fill="#38bdf8">1. Pre-Hop Redirect &amp; Host Guard</text>
  <text x="440" y="78" class="h" fill="#38bdf8">2. SHA-256 Digest &amp; Freshness</text>
  <text x="728" y="78" class="h" fill="#34d399">3. x402 Integer Settlement</text>
  <line x1="48" y1="92" x2="256" y2="92" stroke="#38bdf8" stroke-opacity=".35"/>
  <line x1="336" y1="92" x2="544" y2="92" stroke="#38bdf8" stroke-opacity=".35"/>
  <line x1="624" y1="92" x2="832" y2="92" stroke="#34d399" stroke-opacity=".4"/>

  <text x="152" y="119" class="b">Blocks <tspan class="c k">169.254.169.254</tspan></text>
  <text x="152" y="143" class="b">Rejects unapproved domains</text>
  <text x="152" y="167" class="b">before the hop is followed</text>

  <text x="440" y="119" class="b">Checks <tspan class="c k">release_id</tspan> digest</text>
  <text x="440" y="143" class="b"><tspan class="c k">verified_date</tspan> &#8804; <tspan class="c k">90 days</tspan></text>
  <text x="440" y="167" class="b">Fails closed on stale data</text>

  <text x="728" y="119" class="b">Base <tspan class="c g">chainId 8453</tspan></text>
  <text x="728" y="143" class="b">1 USDC = <tspan class="c g">1_000_000n</tspan></text>
  <text x="728" y="167" class="b">micro-units, BigInt only</text>
</svg>
